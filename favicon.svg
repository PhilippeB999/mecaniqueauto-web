<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#51637a"/><stop offset="55%" stop-color="#37475b"/><stop offset="100%" stop-color="#1f2b3a"/></linearGradient><linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4e2a6"/><stop offset="48%" stop-color="#c9a961"/><stop offset="100%" stop-color="#9c7d3f"/></linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7f9fb"/><stop offset="100%" stop-color="#c4ccd3"/></linearGradient></defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect x="36" y="36" width="440" height="440" rx="60" fill="none" stroke="url(#brass)" stroke-width="13"/>
  <g transform="translate(256 256) rotate(-38)">
    <!-- barre -->
    <rect x="-118" y="-22" width="268" height="44" rx="22" fill="url(#steel)"/>
    <!-- anneau (cle a oeil) a droite -->
    <circle cx="150" cy="0" r="58" fill="url(#steel)"/>
    <circle cx="150" cy="0" r="32" fill="url(#bg)"/>
    <!-- machoire ouverte a gauche : tete + fente ouverte -->
    <rect x="-208" y="-60" width="104" height="120" rx="20" fill="url(#steel)"/>
    <path d="M-235 -24 H-150 V24 H-235 L-208 0 Z" fill="url(#bg)"/>
    <!-- contour leger -->
    <circle cx="150" cy="0" r="58" fill="none" stroke="#4b535c" stroke-width="4"/>
  </g>
</svg>